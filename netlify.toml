# Static site at the repo root + serverless functions for the live pledge ledger.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Clean URLs for the functions:  /api/committed  ->  /.netlify/functions/committed
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# TEMPORARY: site-wide password. Every path 401s until the visitor sends the
# Basic Auth password, which is what keeps the site (and the one-sheet PDF)
# out of search results. Delete this block to go public again.
[[edge_functions]]
  path = "/*"
  function = "password-gate"
