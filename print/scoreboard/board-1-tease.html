<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
.s{position:relative;width:1920px;height:1080px;color:#fff;font-family:'Montserrat',sans-serif;
  background:radial-gradient(120% 120% at 75% 10%,#2a1416 0%,#140d0d 45%,#000 100%)}
.s::after{content:'';position:absolute;inset:0;background:radial-gradient(45% 40% at 72% 45%,rgba(250,204,8,.14),transparent 70%)}
.card{position:absolute;left:150px;top:90px;width:640px;transform:rotate(-4deg);box-shadow:0 40px 90px rgba(0,0,0,.7);border-radius:16px}
.copy{position:absolute;left:880px;top:0;height:1080px;width:960px;display:flex;flex-direction:column;justify-content:center;z-index:2}
.eyebrow{font-weight:700;font-size:34px;letter-spacing:.18em;text-transform:uppercase;color:#FACC08;margin-bottom:26px}
h1{font-weight:900;line-height:.95;font-size:150px;letter-spacing:-.01em}
h1 .g{color:#FACC08}
.sub{font-family:'Open Sans',sans-serif;font-size:40px;line-height:1.35;color:rgba(255,255,255,.9);margin-top:34px;max-width:900px}
.sub b{color:#fff;font-weight:600}
.badge{position:absolute;right:70px;bottom:60px;font-weight:700;font-size:26px;letter-spacing:.16em;color:rgba(255,255,255,.55);text-transform:uppercase}
.qrbox{display:flex;align-items:center;gap:40px;margin-top:44px}
.qrbox svg{width:300px;height:300px;background:#fff;padding:0;border-radius:14px}
.qrbox .t{font-size:36px;line-height:1.3;font-family:'Open Sans',sans-serif}
.qrbox .t b{display:block;font-family:'Montserrat',sans-serif;font-weight:900;font-size:52px;color:#FACC08;margin-bottom:10px}
.qrbox .t small{display:block;font-size:30px;color:rgba(255,255,255,.7);margin-top:8px}
</style></head><body><div class="s">
<img class="card" src="https://res.cloudinary.com/dsbllwpbh/image/upload/f_auto,q_auto:best,w_900/v1788534779/piron-legacy/cards/card03-front-web.jpg" alt="">
<div class="copy">
  <div class="eyebrow">Check the card in your pocket</div>
  <h1>WHO IS<br><span class="g">#89?</span></h1>
  <div class="sub">A Batavia Bulldog. A receiver. Early 1980s.<br>He's been on a Bulldog sideline most Friday nights for <b>thirty years</b>.<br><br><b>Scan the code on the back of the card to find out.</b></div>
</div>
<div class="badge">Card 3 of 10</div>
</div></body></html>
