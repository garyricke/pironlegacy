<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card 04 — Head Coach — front art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   CARD 04 · HEAD COACH — front art, web render (trim only, NOT a press
   file; rebuild from print/card03/card03.html for print, as with 01/02).
   Photo: piron-legacy/cards/headcoach-fay — Ced Jay Photography (Cedric
   Jones), approved Oct 8 2026 "by all means use the shots". Credit line
   "Photo: Ced Jay Photography" goes wherever this card is shown. The c_crop
   keeps his signature watermark (bottom-right) fully out of frame rather
   than half-hidden behind the pennant.
   ═══════════════════════════════════════════════════════════════ */
:root{ --maroon:#7a0f14; --gold:#facc08; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{background:#fff;width:2.5in;height:3.5in;overflow:hidden}

.card{position:relative;width:2.5in;height:3.5in;overflow:hidden}
.wood{position:absolute;inset:0;background:
  repeating-linear-gradient(94deg,#8a5a2b 0 .028in,#7a4d22 .028in .047in,#9c6a35 .047in .085in,#8a5a2b .085in .122in)}
.front-in{position:absolute;inset:0;padding:.108in .108in 0}
.frame{position:relative;height:2.70in;overflow:hidden;border:.018in solid #fff;
  box-shadow:0 .008in .026in rgba(0,0,0,.4)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}

.team{position:absolute;top:0;left:0;background:var(--maroon);color:var(--gold);
  font-family:'Montserrat',sans-serif;font-weight:900;font-size:5.2pt;letter-spacing:.019in;padding:.042in .075in}
.pennant{position:absolute;bottom:0;right:0;width:0;height:0;
  border-left:.46in solid transparent;border-bottom:.46in solid var(--gold)}
.pennant-txt{position:absolute;bottom:.05in;right:.05in;font-family:'Montserrat',sans-serif;
  font-weight:900;font-size:8.6pt;color:#2a1416;z-index:2}

.plate{padding:.075in .033in 0;text-align:center}
.plate .nm{font-family:'Montserrat',sans-serif;font-weight:900;font-size:11.6pt;color:#fff;
  text-shadow:.008in .008in 0 #4a2c10;letter-spacing:.002in;line-height:1}
.plate .pos{font-family:'Montserrat',sans-serif;font-weight:700;font-size:5.6pt;letter-spacing:.022in;
  color:#ffe9a8;margin-top:.033in;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="wood"></div>
  <div class="front-in">
    <div class="frame">
      <img src="https://res.cloudinary.com/dsbllwpbh/image/upload/c_crop,x_900,y_0,w_3450,h_4078/c_fill,w_1200,h_1419,q_95,f_jpg/v1787076273/piron-legacy/cards/headcoach-fay.jpg" alt="Coach Dennis Piron on the sideline, arms crossed">
      <span class="team">BATAVIA BULLDOGS</span>
      <span class="pennant"></span><span class="pennant-txt">04</span>
    </div>
    <div class="plate">
      <div class="nm">DENNIS PIRON</div>
      <div class="pos">Head Coach &middot; Batavia Bulldogs</div>
    </div>
  </div>
</div>
</body>
</html>
